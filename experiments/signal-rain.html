<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Rain — zuuxo lab</title><link rel="stylesheet" href="../assets/css/base.css"></head><body><div class="exp-shell"><div class="noise"></div><div class="exp-topbar"><a class="back" href="../index.html">← laboratory</a><span class="exp-name">006 / signal rain</span></div><button class="fullscreen">fullscreen</button><canvas id="c" class="stage"></canvas><div class="hud"><h1>Signal<br>Rain</h1><p>Vertical streams generated from tiny packets of machine-like symbols. The visual language is data flow, not Matrix imitation.</p></div><div class="controls"><div class="control"><label>streams <span id="sv">72</span></label><input id="streams" type="range" min="20" max="140" value="72"></div><div class="control"><label>speed <span id="pv">44</span></label><input id="pace" type="range" min="10" max="100" value="44"></div></div><a class="next-exp" href="depth-lines.html">next / depth lines →</a></div><script type="module">import{qs,resizeCanvas,fullscreenButton,pointer}from'../assets/js/common.js';fullscreenButton();const c=qs('#c'),x=c.getContext('2d'),p=pointer(),chars='01<>/{}[];:+-*';let s=resizeCanvas(c,x),drops=[];function reset(){drops=[];for(let i=0;i<+qs('#streams').value;i++)drops.push({x:Math.random()*s.w,y:Math.random()*s.h,v:.4+Math.random()*1.8,len:3+Math.random()*12})}reset();addEventListener('resize',()=>{s=resizeCanvas(c,x);reset()});qs('#streams').oninput=e=>{qs('#sv').textContent=e.target.value;reset()};qs('#pace').oninput=e=>qs('#pv').textContent=e.target.value;function loop(){x.fillStyle='rgba(6,8,13,.16)';x.fillRect(0,0,s.w,s.h);x.font='11px ui-monospace,monospace';for(const d of drops){d.y+=d.v*(+qs('#pace').value)*.055;for(let j=0;j<d.len;j++){let yy=d.y-j*15,dist=Math.abs(d.x-p.x),alpha=Math.max(.05,.75-j/d.len*.7)*(1+Math.max(0,1-dist/220));x.fillStyle=`rgba(154,230,255,${Math.min(alpha,1)})`;x.fillText(chars[(Math.random()*chars.length)|0],d.x,yy)}if(d.y-d.len*15>s.h){d.y=-20;d.x=Math.random()*s.w}}requestAnimationFrame(loop)}loop();</script></body></html>
