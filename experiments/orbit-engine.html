<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Engine — zuuxo lab</title><link rel="stylesheet" href="../assets/css/base.css"></head><body><div class="exp-shell"><div class="noise"></div><div class="exp-topbar"><a class="back" href="../index.html">← laboratory</a><span class="exp-name">005 / orbit engine</span></div><button class="fullscreen">fullscreen</button><div id="stage" class="stage"></div><div class="hud"><h1>Orbit<br>Engine</h1><p>A minimal Three.js scene: layered rings, drifting points and a camera that follows the pointer with deliberately slow inertia.</p></div><div class="controls"><div class="control"><label>rotation <span id="rv">40</span></label><input id="rotation" type="range" min="0" max="100" value="40"></div><div class="control"><label>depth <span id="dv">60</span></label><input id="depth" type="range" min="20" max="100" value="60"></div></div><a class="next-exp" href="signal-rain.html">next / signal rain →</a></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{qs,pointer,fullscreenButton}from'../assets/js/common.js';fullscreenButton();const p=pointer(),stage=qs('#stage'),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);cam.position.z=8;const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);stage.appendChild(r.domElement);const group=new THREE.Group();scene.add(group);for(let i=0;i<7;i++){const g=new THREE.TorusGeometry(1.2+i*.34,.008+i*.002,10,180);const m=new THREE.MeshBasicMaterial({color:i%2?0xc5a3ff:0x9ae6ff,transparent:true,opacity:.16+i*.03});const mesh=new THREE.Mesh(g,m);mesh.rotation.x=Math.random()*Math.PI;mesh.rotation.y=Math.random()*Math.PI;group.add(mesh)}const geo=new THREE.BufferGeometry(),arr=[];for(let i=0;i<700;i++){let a=Math.random()*Math.PI*2,rr=1.5+Math.random()*3.7,z=(Math.random()-.5)*4;arr.push(Math.cos(a)*rr,Math.sin(a)*rr,z)}geo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.018,transparent:true,opacity:.5}));group.add(pts);qs('#rotation').oninput=e=>qs('#rv').textContent=e.target.value;qs('#depth').oninput=e=>qs('#dv').textContent=e.target.value;addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});function loop(){let sp=+qs('#rotation').value*.00008;group.rotation.y+=sp;group.rotation.x+=sp*.35;cam.position.x+=(p.nx*1.3-cam.position.x)*.025;cam.position.y+=(-p.ny*.8-cam.position.y)*.025;cam.position.z=10-(+qs('#depth').value)*.04;cam.lookAt(0,0,0);r.render(scene,cam);requestAnimationFrame(loop)}loop();</script></body></html>
