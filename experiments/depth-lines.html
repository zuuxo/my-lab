<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Lines — zuuxo lab</title><link rel="stylesheet" href="../assets/css/base.css"><style>#s{width:100%;height:100%}.dline{fill:none;stroke:rgba(255,255,255,.13);vector-effect:non-scaling-stroke}</style></head><body><div class="exp-shell"><div class="noise"></div><div class="exp-topbar"><a class="back" href="../index.html">← laboratory</a><span class="exp-name">007 / depth lines</span></div><button class="fullscreen">fullscreen</button><svg id="s" class="stage" viewBox="0 0 1000 700" preserveAspectRatio="none"></svg><div class="hud"><h1>Depth<br>Lines</h1><p>A stack of SVG paths. Pointer movement changes the virtual camera angle, making a flat drawing read as depth.</p></div><div class="controls"><div class="control"><label>layers <span id="lv">34</span></label><input id="layers" type="range" min="10" max="70" value="34"></div><div class="control"><label>depth <span id="dv">110</span></label><input id="depth" type="range" min="20" max="220" value="110"></div></div><a class="next-exp" href="cursor-physics.html">next / cursor physics →</a></div><script type="module">import{qs,pointer,fullscreenButton}from'../assets/js/common.js';fullscreenButton();const s=qs('#s'),p=pointer();function build(){s.innerHTML='';for(let i=0;i<+qs('#layers').value;i++){let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.classList.add('dline');path.dataset.i=i;s.appendChild(path)}}build();qs('#layers').oninput=e=>{qs('#lv').textContent=e.target.value;build()};qs('#depth').oninput=e=>qs('#dv').textContent=e.target.value;let t=0;function loop(){t+=.012;[...s.children].forEach((path,i)=>{let n=s.children.length,z=i/n,off=(z-.5)*(+qs('#depth').value),d='';for(let x=0;x<=1000;x+=25){let y=350+Math.sin(x*.012+t+z*4)*55+Math.sin(x*.021-t*.8)*25+off+(p.ny*off*.8),xx=x+p.nx*off*.55;d+=(x?'L':'M')+xx+' '+y}path.setAttribute('d',d);path.style.opacity=.08+z*.55});requestAnimationFrame(loop)}loop();</script></body></html>
