<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Type Field — zuuxo lab</title><link rel="stylesheet" href="../assets/css/base.css"><style>#field{position:absolute;inset:0;overflow:hidden}.glyph{position:absolute;font-weight:700;font-size:clamp(22px,2.8vw,48px);letter-spacing:-.08em;will-change:transform,opacity;mix-blend-mode:screen}</style></head><body><div class="exp-shell"><div class="noise"></div><div class="exp-topbar"><a class="back" href="../index.html">← laboratory</a><span class="exp-name">004 / type field</span></div><button class="fullscreen">fullscreen</button><div id="field" class="stage"></div><div class="hud"><h1>Type<br>Field</h1><p>Typography treated as matter. Every glyph has a home coordinate and a temporary displacement generated by the pointer.</p></div><div class="controls"><div class="control"><label>radius <span id="rv">240</span></label><input id="radius" type="range" min="80" max="500" value="240"></div><div class="control"><label>strength <span id="sv">130</span></label><input id="strength" type="range" min="20" max="260" value="130"></div></div><a class="next-exp" href="orbit-engine.html">next / orbit engine →</a></div><script type="module">import{qs,pointer,fullscreenButton}from'../assets/js/common.js';fullscreenButton();const p=pointer(),f=qs('#field'),letters='Z U U X O / L A B / S Y S T E M / M O T I O N / S I G N A L /'.split(' ');let items=[];function build(){f.innerHTML='';items=[];const gap=82,cols=Math.ceil(innerWidth/gap)+2,rows=Math.ceil(innerHeight/gap)+2;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let e=document.createElement('span');e.className='glyph';e.textContent=letters[(x+y*cols)%letters.length];let px=x*gap-20,py=y*gap-20;e.style.left=px+'px';e.style.top=py+'px';e.style.color=(x+y)%3===0?'#9ae6ff':(x+y)%3===1?'#c5a3ff':'#f5f7fb';f.appendChild(e);items.push({e,x:px,y:py})}}build();addEventListener('resize',build);['radius','strength'].forEach(id=>qs('#'+id).oninput=e=>qs('#'+id[0]+'v').textContent=e.target.value);function loop(){let r=+qs('#radius').value,str=+qs('#strength').value;for(const a of items){let dx=a.x-p.x,dy=a.y-p.y,d=Math.hypot(dx,dy)||1,k=Math.max(0,1-d/r),tx=dx/d*k*str,ty=dy/d*k*str;a.e.style.transform=`translate(${tx}px,${ty}px) rotate(${tx*.08}deg) scale(${1+k*.8})`;a.e.style.opacity=.18+k*.8}requestAnimationFrame(loop)}loop();</script></body></html>
