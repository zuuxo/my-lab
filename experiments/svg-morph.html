<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG Morph — zuuxo lab</title><link rel="stylesheet" href="../assets/css/base.css"><style>svg.stage{width:100%;height:100%}.blob{filter:url(#glow)}.ring{fill:none;stroke:rgba(255,255,255,.09)} </style></head><body><div class="exp-shell"><div class="noise"></div><div class="exp-topbar"><a class="back" href="../index.html">← laboratory</a><span class="exp-name">002 / svg morph</span></div><button class="fullscreen">fullscreen</button><svg class="stage" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="g"><stop stop-color="#9ae6ff"/><stop offset=".5" stop-color="#c5a3ff"/><stop offset="1" stop-color="#06080d" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle class="ring" cx="500" cy="350" r="260"/><circle class="ring" cx="500" cy="350" r="190"/><circle class="ring" cx="500" cy="350" r="120"/><path id="blob" class="blob" fill="url(#g)" opacity=".88"/></svg><div class="hud"><h1>SVG<br>Morph</h1><p>A single vector body reconstructed every frame. Its radius is sampled around a polar field and continuously distorted.</p></div><div class="controls"><div class="control"><label>complexity <span id="cv">7</span></label><input id="complexity" type="range" min="2" max="14" value="7"></div><div class="control"><label>amplitude <span id="av">86</span></label><input id="amp" type="range" min="20" max="150" value="86"></div><div class="control"><label>speed <span id="sv">34</span></label><input id="speed" type="range" min="5" max="90" value="34"></div></div><a class="next-exp" href="procedural-grid.html">next / procedural grid →</a></div><script type="module">import{qs,fullscreenButton,pointer}from'../assets/js/common.js';fullscreenButton();const b=qs('#blob'),p=pointer();['complexity','amp','speed'].forEach(id=>qs('#'+id).oninput=e=>qs('#'+id[0]+'v').textContent=e.target.value);let t=0;function loop(){t+=+qs('#speed').value*.00045;const n=120,cx=500+p.nx*70,cy=350+p.ny*50,base=160,amp=+qs('#amp').value,comp=+qs('#complexity').value;let d='';for(let i=0;i<n;i++){let a=i/n*Math.PI*2,r=base+Math.sin(a*comp+t)*amp*.32+Math.sin(a*(comp*.53)-t*1.7)*amp*.24+Math.cos(a*3+t*.7)*amp*.14;let x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;d+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)}b.setAttribute('d',d+'Z');requestAnimationFrame(loop)}loop();</script></body></html>
