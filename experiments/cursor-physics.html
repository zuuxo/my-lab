<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursor Physics — zuuxo lab</title><link rel="stylesheet" href="../assets/css/base.css"></head><body><div class="exp-shell"><div class="noise"></div><div class="exp-topbar"><a class="back" href="../index.html">← laboratory</a><span class="exp-name">008 / cursor physics</span></div><button class="fullscreen">fullscreen</button><canvas id="c" class="stage"></canvas><div class="hud"><h1>Cursor<br>Physics</h1><p>A chain of spring-connected particles follows the pointer. The line is calculated, not drawn as a preset animation.</p></div><div class="controls"><div class="control"><label>segments <span id="sv">52</span></label><input id="segments" type="range" min="12" max="100" value="52"></div><div class="control"><label>elasticity <span id="ev">28</span></label><input id="elastic" type="range" min="5" max="60" value="28"></div></div><a class="next-exp" href="particle-field.html">loop / particle field →</a></div><script type="module">import{qs,pointer,resizeCanvas,fullscreenButton}from'../assets/js/common.js';fullscreenButton();const c=qs('#c'),x=c.getContext('2d'),p=pointer();let s=resizeCanvas(c,x),pts=[];function reset(){pts=[];for(let i=0;i<+qs('#segments').value;i++)pts.push({x:s.w/2,y:s.h/2,vx:0,vy:0})}reset();addEventListener('resize',()=>{s=resizeCanvas(c,x);reset()});qs('#segments').oninput=e=>{qs('#sv').textContent=e.target.value;reset()};qs('#elastic').oninput=e=>qs('#ev').textContent=e.target.value;function loop(){x.fillStyle='rgba(6,8,13,.28)';x.fillRect(0,0,s.w,s.h);let tx=p.x,ty=p.y,k=+qs('#elastic').value*.0009;for(let i=0;i<pts.length;i++){const a=pts[i],fac=k*(1-i/pts.length*.72);a.vx+=(tx-a.x)*fac;a.vy+=(ty-a.y)*fac;a.vx*=.84;a.vy*=.84;a.x+=a.vx;a.y+=a.vy;tx=a.x;ty=a.y}x.beginPath();pts.forEach((a,i)=>i?x.lineTo(a.x,a.y):x.moveTo(a.x,a.y));x.strokeStyle='rgba(154,230,255,.65)';x.lineWidth=1;x.stroke();pts.forEach((a,i)=>{x.beginPath();x.arc(a.x,a.y,Math.max(.8,3-i/pts.length*2.2),0,Math.PI*2);x.fillStyle=i%3===0?'#c5a3ff':'#f5f7fb';x.fill()});requestAnimationFrame(loop)}loop();</script></body></html>
