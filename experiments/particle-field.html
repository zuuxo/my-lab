<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle Field — zuuxo lab</title><link rel="stylesheet" href="../assets/css/base.css"></head><body><div class="exp-shell"><div class="noise"></div><div class="exp-topbar"><a class="back" href="../index.html">← laboratory</a><span class="exp-name">001 / particle field</span></div><button class="fullscreen">fullscreen</button><canvas id="c" class="stage"></canvas><div class="hud"><h1>Particle<br>Field</h1><p>Thousands of points behave like a fluid sketch. The pointer becomes a moving force source rather than a cursor.</p></div><div class="controls"><div class="control"><label>density <span id="dv">900</span></label><input id="density" type="range" min="200" max="1800" value="900"></div><div class="control"><label>force <span id="fv">80</span></label><input id="force" type="range" min="10" max="180" value="80"></div><div class="control"><label>trail <span id="tv">16</span></label><input id="trail" type="range" min="3" max="40" value="16"></div></div><a class="next-exp" href="svg-morph.html">next / svg morph →</a></div><script type="module">
import{qs,pointer,resizeCanvas,fullscreenButton}from'../assets/js/common.js';fullscreenButton();const c=qs('#c'),x=c.getContext('2d'),p=pointer();let sz=resizeCanvas(c,x),pts=[];function reset(){pts=[];for(let i=0;i<+qs('#density').value;i++)pts.push({x:Math.random()*sz.w,y:Math.random()*sz.h,vx:0,vy:0,s:Math.random()*1.5+.2})}reset();addEventListener('resize',()=>{sz=resizeCanvas(c,x);reset()});qs('#density').oninput=e=>{qs('#dv').textContent=e.target.value;reset()};qs('#force').oninput=e=>qs('#fv').textContent=e.target.value;qs('#trail').oninput=e=>qs('#tv').textContent=e.target.value;function loop(){x.fillStyle=`rgba(6,8,13,${1/(+qs('#trail').value)})`;x.fillRect(0,0,sz.w,sz.h);for(const a of pts){let dx=a.x-p.x,dy=a.y-p.y,d=Math.hypot(dx,dy)||1,f=Math.max(0,1-d/250)*(+qs('#force').value)/d;a.vx+=dx*f*.014;a.vy+=dy*f*.014;a.vx*=.985;a.vy*=.985;a.x+=a.vx+.18;a.y+=a.vy;if(a.x<0)a.x=sz.w;if(a.x>sz.w)a.x=0;if(a.y<0)a.y=sz.h;if(a.y>sz.h)a.y=0;x.fillStyle=d<220?'rgba(154,230,255,.9)':'rgba(255,255,255,.34)';x.fillRect(a.x,a.y,a.s,a.s)}requestAnimationFrame(loop)}loop();
</script></body></html>
