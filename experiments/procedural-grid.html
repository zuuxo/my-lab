<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procedural Grid — zuuxo lab</title><link rel="stylesheet" href="../assets/css/base.css"></head><body><div class="exp-shell"><div class="noise"></div><div class="exp-topbar"><a class="back" href="../index.html">← laboratory</a><span class="exp-name">003 / procedural grid</span></div><button class="fullscreen">fullscreen</button><canvas id="c" class="stage"></canvas><div class="hud"><h1>Procedural<br>Grid</h1><p>A coordinate system that refuses to stay flat. Each node bends according to distance, time and pointer pressure.</p></div><div class="controls"><div class="control"><label>spacing <span id="sv">38</span></label><input id="spacing" type="range" min="18" max="70" value="38"></div><div class="control"><label>warp <span id="wv">90</span></label><input id="warp" type="range" min="0" max="180" value="90"></div></div><a class="next-exp" href="type-field.html">next / type field →</a></div><script type="module">import{qs,pointer,resizeCanvas,fullscreenButton}from'../assets/js/common.js';fullscreenButton();const c=qs('#c'),x=c.getContext('2d'),p=pointer();let s=resizeCanvas(c,x),t=0;addEventListener('resize',()=>s=resizeCanvas(c,x));['spacing','warp'].forEach(id=>qs('#'+id).oninput=e=>qs('#'+id[0]+'v').textContent=e.target.value);function loop(){t+=.012;x.fillStyle='#06080d';x.fillRect(0,0,s.w,s.h);const sp=+qs('#spacing').value,w=+qs('#warp').value;for(let gy=-sp;gy<s.h+sp;gy+=sp){x.beginPath();for(let gx=-sp;gx<s.w+sp;gx+=sp){let dx=gx-p.x,dy=gy-p.y,d=Math.hypot(dx,dy)||1,k=Math.max(0,1-d/350),xx=gx+Math.sin(gy*.015+t)*8-dx/d*k*w,yy=gy+Math.cos(gx*.013-t)*8-dy/d*k*w;(gx===-sp?x.moveTo(xx,yy):x.lineTo(xx,yy))}x.strokeStyle='rgba(154,230,255,.12)';x.stroke()}for(let gx=-sp;gx<s.w+sp;gx+=sp){x.beginPath();for(let gy=-sp;gy<s.h+sp;gy+=sp){let dx=gx-p.x,dy=gy-p.y,d=Math.hypot(dx,dy)||1,k=Math.max(0,1-d/350),xx=gx+Math.sin(gy*.015+t)*8-dx/d*k*w,yy=gy+Math.cos(gx*.013-t)*8-dy/d*k*w;(gy===-sp?x.moveTo(xx,yy):x.lineTo(xx,yy))}x.strokeStyle='rgba(197,163,255,.10)';x.stroke()}requestAnimationFrame(loop)}loop();</script></body></html>
